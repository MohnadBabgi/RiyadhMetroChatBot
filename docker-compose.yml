version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-Xenova/paraphrase-multilingual-MiniLM-L12-v2}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.55}
      - TOP_K_RESULTS=${TOP_K_RESULTS:-5}
      - CORS_ORIGIN=${CORS_ORIGIN}
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  app-data:
